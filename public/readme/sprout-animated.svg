<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-label="Animated Sprout: a woodland companion bouncing while hearts float up">
  <style>
    .bob { animation: bob 1.6s ease-in-out infinite; transform-origin: 360px 170px; }
    .ear-l { animation: wiggle 1.6s ease-in-out infinite; transform-origin: 318px 110px; }
    .ear-r { animation: wiggle 1.6s ease-in-out infinite reverse; transform-origin: 402px 110px; }
    .heart { fill: #e0474c; animation: rise 3.2s ease-in infinite; opacity: 0; }
    .h1 { animation-delay: 0s; }
    .h2 { animation-delay: 1.1s; }
    .h3 { animation-delay: 2.2s; }
    .blink { animation: blink 4s infinite; transform-origin: center; }
    .shadow { animation: shrink 1.6s ease-in-out infinite; transform-origin: 360px 218px; }
    .label { font: 600 22px -apple-system, Segoe UI, Helvetica, Arial, sans-serif; fill: #3f5b4a; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
    @keyframes wiggle { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-8deg); } }
    @keyframes rise { 0% { transform: translateY(0) scale(0.6); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-120px) scale(1); opacity: 0; } }
    @keyframes blink { 0%,94%,100% { transform: scaleY(1); } 97% { transform: scaleY(0.1); } }
    @keyframes shrink { 0%,100% { transform: scaleX(1); opacity: 0.25; } 50% { transform: scaleX(0.85); opacity: 0.18; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .heart { opacity: 0.8; } }
  </style>

  <rect width="720" height="260" rx="20" fill="#f4fbf6"/>
  <text x="360" y="44" text-anchor="middle" style="font: 700 30px -apple-system, Segoe UI, Helvetica, Arial, sans-serif; fill:#2e6b4c">Sprout</text>

  <ellipse class="shadow" cx="360" cy="218" rx="70" ry="10" fill="#2e6b4c"/>

  <g class="bob">
    <path class="ear-l" d="M318 130 L302 78 Q332 96 344 128 Z" fill="#9fdcb4"/>
    <path class="ear-r" d="M402 130 L418 78 Q388 96 376 128 Z" fill="#9fdcb4"/>
    <ellipse cx="360" cy="165" rx="62" ry="56" fill="#fff4e0" stroke="#e6d2b0" stroke-width="3"/>
    <path d="M330 118 Q360 102 390 118 Q360 112 330 118 Z" fill="#9fdcb4"/>
    <g class="blink">
      <circle cx="338" cy="160" r="6" fill="#3f5b4a"/>
      <circle cx="382" cy="160" r="6" fill="#3f5b4a"/>
    </g>
    <ellipse cx="322" cy="180" rx="8" ry="5" fill="#f7a6a6"/>
    <ellipse cx="398" cy="180" rx="8" ry="5" fill="#f7a6a6"/>
    <path d="M348 180 Q360 190 372 180" stroke="#3f5b4a" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <path class="heart h1" d="M0 0 C-10 -12 -26 -2 -14 10 L0 22 L14 10 C26 -2 10 -12 0 0 Z" transform="translate(470 150)"/>
  <path class="heart h2" d="M0 0 C-10 -12 -26 -2 -14 10 L0 22 L14 10 C26 -2 10 -12 0 0 Z" transform="translate(250 140)"/>
  <path class="heart h3" d="M0 0 C-10 -12 -26 -2 -14 10 L0 22 L14 10 C26 -2 10 -12 0 0 Z" transform="translate(500 180)"/>
</svg>
