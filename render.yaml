services:
  - type: web
    name: sprout-rooms
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --omit=dev --ignore-scripts
    startCommand: node index.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
